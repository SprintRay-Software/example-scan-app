name: release

# Tagging is the release. Push a `v*` tag and this builds both desktop targets and
# attaches them to a GitHub Release under that tag:
#
#   Windows  x64    NSIS installer (.exe)   — Windows 10 1809 and newer
#   macOS    arm64  .dmg and .zip           — Apple silicon
#
# workflow_dispatch runs the same build without a tag, so the pipeline can be exercised
# without cutting a release (it uploads workflow artifacts and skips the release step).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: win
            os: windows-latest
            build_args: --win --x64
          # macos-14 is the Apple-silicon runner, so the arm64 build is native.
          - label: macos-arm64
            platform: mac
            os: macos-14
            build_args: --mac --arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the single source of truth for the version, so the built app reports
      # the same string the release is named after (app.getVersion() feeds /status and
      # the telemetry batch). No commit is made — this only affects the build.
      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          npm pkg set version="$VERSION"

      # Signing is opt-in through repository secrets. Without them the macOS build is only
      # ad-hoc signed, and Gatekeeper on macOS 15+ rejects that on any Finder / URL-scheme /
      # local-service launch — the app starts and is killed within a second. Add
      # MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD (a Developer ID .p12, base64) to sign, and
      # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID to also notarize.
      - name: Detect macOS signing secrets
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "MAC_SIGNING=1" >> "$GITHUB_ENV"
            echo "Developer ID certificate present — the build will be signed"
          else
            echo "MAC_SIGNING=0" >> "$GITHUB_ENV"
            echo "::warning::No MAC_CSC_LINK secret; the macOS build is ad-hoc signed only and Gatekeeper will refuse to launch it. See the README."
          fi

      - name: Build
        shell: bash
        env:
          # With a certificate present, let electron-builder use it; otherwise stop it hunting
          # for an identity that is not there.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_SIGNING == '1' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Ends up in the telemetry batch as app.build, tying a report to this exact binary.
          SCANPRO_BUILD: ${{ github.sha }}
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Report the macOS signing result
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          [ -z "$APP" ] && exit 0
          echo "Signature:"; codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier' || true
          echo "Gatekeeper:"; spctl -a -vvv -t exec "$APP" 2>&1 | head -3 || true

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          # Only the installable outputs; skip blockmaps and the unpacked app directories.
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artifacts
          # Re-running the workflow on the same tag must replace the assets, not fail.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
